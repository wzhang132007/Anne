    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Lab - Beakers Experiment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lab-table {
            background: linear-gradient(to bottom, #8B4513 0%, #654321 100%);
            width: 95%;
            max-width: 1200px;
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: visible;
            border: 3px solid #5a3a1a;
        }

        .table-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #a0826d 0%, #8B4513 50%, #6d5a4d 100%);
            border-radius: 10px;
            opacity: 0.8;
        }

        .beakers-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 50px;
        }

        .beaker {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .beaker:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .beaker svg {
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .beaker-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ecf0f1;
            font-size: 12px;
            white-space: nowrap;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 3px;
        }

        /* Liquid animation effect */
        @keyframes bubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .liquid {
            animation: bubble 3s ease-in-out infinite;
        }

        /* Glass shine effect */
        .glass-shine {
            opacity: 0.3;
            fill: white;
        }
    </style>
</head>

                console.log(`Clicked beaker ${index + 1}: ${label}`);
            });
        });

        // Add simple liquid wave effect
        let time = 0;
        setInterval(() => {
            time += 0.1;
            document.querySelectorAll('.liquid').forEach((liquid, i) => {
                const offset = Math.sin(time + i) * 2;
                liquid.style.transform = `translateY(${offset}px)`;
            });
        }, 50);
    </script>
</body>
</html>
