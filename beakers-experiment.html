<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学实验 - 烧杯实验台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: #ecf0f1;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .lab-table {
            background: linear-gradient(to bottom, #8B4513 0%, #654321 100%);
            width: 95%;
            max-width: 1200px;
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: visible;
            border: 3px solid #5a3a1a;
        }

        .table-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #a0826d 0%, #8B4513 50%, #6d5a4d 100%);
            border-radius: 10px;
            opacity: 0.8;
        }

        .beakers-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 50px;
        }

        .beaker {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .beaker:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .beaker svg {
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .beaker-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ecf0f1;
            font-size: 12px;
            white-space: nowrap;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 3px;
        }

        /* 液体动画效果 */
        @keyframes bubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .liquid {
            animation: bubble 3s ease-in-out infinite;
        }

        /* 玻璃光泽效果 */
        .glass-shine {
            opacity: 0.3;
            fill: white;
        }

        .info-panel {
            margin-top: 30px;
            color: #ecf0f1;
            text-align: center;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <h1>🧪 化学实验室 - 烧杯实验台</h1>

    <div class="lab-table">
        <div class="table-surface"></div>
        <div class="beakers-container">
            <!-- 烧杯 1 - 蓝色液体 -->
            <div class="beaker" id="beaker1">
                <svg width="120" height="150" viewBox="0 0 120 150">
                    <!-- 烧杯主体 -->
                    <path d="M 30 30 L 20 120 Q 20 130 30 135 L 90 135 Q 100 130 100 120 L 90 30 Z"
                          fill="rgba(255,255,255,0.1)"
                          stroke="rgba(255,255,255,0.4)"
                          stroke-width="2"/>

                    <!-- 液体 -->
                    <path class="liquid" d="M 32 80 L 24 120 Q 24 128 32 132 L 88 132 Q 96 128 96 120 L 88 80 Z"
                          fill="rgba(52, 152, 219, 0.8)"/>

                    <!-- 刻度线 -->
                    <line x1="30" y1="90" x2="35" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="70" x2="35" y2="70" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

                    <!-- 玻璃光泽 -->
                    <ellipse class="glass-shine" cx="40" cy="60" rx="8" ry="20"/>
                </svg>
                <div class="beaker-label">蓝色溶液</div>
            </div>

            <!-- 烧杯 2 - 绿色液体 -->
            <div class="beaker" id="beaker2">
                <svg width="120" height="150" viewBox="0 0 120 150">
                    <path d="M 30 30 L 20 120 Q 20 130 30 135 L 90 135 Q 100 130 100 120 L 90 30 Z"
                          fill="rgba(255,255,255,0.1)"
                          stroke="rgba(255,255,255,0.4)"
                          stroke-width="2"/>

                    <path class="liquid" d="M 32 70 L 22 120 Q 22 128 32 132 L 88 132 Q 98 128 98 120 L 88 70 Z"
                          fill="rgba(46, 204, 113, 0.8)"/>

                    <line x1="30" y1="90" x2="35" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="70" x2="35" y2="70" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

                    <ellipse class="glass-shine" cx="40" cy="60" rx="8" ry="20"/>
                </svg>
                <div class="beaker-label">绿色溶液</div>
            </div>

            <!-- 烧杯 3 - 粉色液体 -->
            <div class="beaker" id="beaker3">
                <svg width="120" height="150" viewBox="0 0 120 150">
                    <path d="M 30 30 L 20 120 Q 20 130 30 135 L 90 135 Q 100 130 100 120 L 90 30 Z"
                          fill="rgba(255,255,255,0.1)"
                          stroke="rgba(255,255,255,0.4)"
                          stroke-width="2"/>

                    <path class="liquid" d="M 32 65 L 21 120 Q 21 128 32 132 L 88 132 Q 99 128 99 120 L 88 65 Z"
                          fill="rgba(231, 76, 60, 0.7)"/>

                    <line x1="30" y1="90" x2="35" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="70" x2="35" y2="70" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

                    <ellipse class="glass-shine" cx="40" cy="60" rx="8" ry="20"/>
                </svg>
                <div class="beaker-label">粉色溶液</div>
            </div>

            <!-- 烧杯 4 - 紫色液体 -->
            <div class="beaker" id="beaker4">
                <svg width="120" height="150" viewBox="0 0 120 150">
                    <path d="M 30 30 L 20 120 Q 20 130 30 135 L 90 135 Q 100 130 100 120 L 90 30 Z"
                          fill="rgba(255,255,255,0.1)"
                          stroke="rgba(255,255,255,0.4)"
                          stroke-width="2"/>

                    <path class="liquid" d="M 32 75 L 23 120 Q 23 128 32 132 L 88 132 Q 97 128 97 120 L 88 75 Z"
                          fill="rgba(155, 89, 182, 0.8)"/>

                    <line x1="30" y1="90" x2="35" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="70" x2="35" y2="70" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

                    <ellipse class="glass-shine" cx="40" cy="60" rx="8" ry="20"/>
                </svg>
                <div class="beaker-label">紫色溶液</div>
            </div>

            <!-- 烧杯 5 - 黄色液体 -->
            <div class="beaker" id="beaker5">
                <svg width="120" height="150" viewBox="0 0 120 150">
                    <path d="M 30 30 L 20 120 Q 20 130 30 135 L 90 135 Q 100 130 100 120 L 90 30 Z"
                          fill="rgba(255,255,255,0.1)"
                          stroke="rgba(255,255,255,0.4)"
                          stroke-width="2"/>

                    <path class="liquid" d="M 32 85 L 25 120 Q 25 128 32 132 L 88 132 Q 95 128 95 120 L 88 85 Z"
                          fill="rgba(241, 196, 15, 0.8)"/>

                    <line x1="30" y1="90" x2="35" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="70" x2="35" y2="70" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

                    <ellipse class="glass-shine" cx="40" cy="60" rx="8" ry="20"/>
                </svg>
                <div class="beaker-label">黄色溶液</div>
            </div>

            <!-- 烧杯 6 - 橙色液体 -->
            <div class="beaker" id="beaker6">
                <svg width="120" height="150" viewBox="0 0 120 150">
                    <path d="M 30 30 L 20 120 Q 20 130 30 135 L 90 135 Q 100 130 100 120 L 90 30 Z"
                          fill="rgba(255,255,255,0.1)"
                          stroke="rgba(255,255,255,0.4)"
                          stroke-width="2"/>

                    <path class="liquid" d="M 32 60 L 21 120 Q 21 128 32 132 L 88 132 Q 99 128 99 120 L 88 60 Z"
                          fill="rgba(230, 126, 34, 0.8)"/>

                    <line x1="30" y1="90" x2="35" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="70" x2="35" y2="70" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <line x1="30" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

                    <ellipse class="glass-shine" cx="40" cy="60" rx="8" ry="20"/>
                </svg>
                <div class="beaker-label">橙色溶液</div>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <p>✨ 将鼠标悬停在烧杯上查看效果 | 这是化学实验原型的第一步</p>
        <p>📋 实验台上有6个不同颜色的溶液：蓝色、绿色、粉色、紫色、黄色、橙色</p>
    </div>

    <script>
        // 添加交互效果
        const beakers = document.querySelectorAll('.beaker');

        beakers.forEach((beaker, index) => {
            beaker.addEventListener('click', () => {
                const label = beaker.querySelector('.beaker-label').textContent;
                console.log(`点击了第 ${index + 1} 个烧杯: ${label}`);
            });
        });

        // 添加简单的液体波动效果
        let time = 0;
        setInterval(() => {
            time += 0.1;
            document.querySelectorAll('.liquid').forEach((liquid, i) => {
                const offset = Math.sin(time + i) * 2;
                liquid.style.transform = `translateY(${offset}px)`;
            });
        }, 50);
    </script>
</body>
</html>
