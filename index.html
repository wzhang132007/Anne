<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Makeup Mini Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: #f9fafb;
    }

    .app {
      width: min(1100px, 100vw - 24px);
      height: min(650px, 100vh - 24px);
      background: #020617;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
    }

    .camera-panel {
      position: relative;
      flex: 3;
      background: #000;
      overflow: hidden;
    }

    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* 隐藏，只用 canvas 显示 */
    }

    #canvasElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hint {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .camera-error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      background: radial-gradient(circle at top, #111827, #020617);
      z-index: 100;
    }

    .tools-panel {
      flex: 2;
      background: linear-gradient(145deg, #020617, #020617, #111827);
      padding: 18px 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-left: 1px solid rgba(30, 64, 175, 0.4);
    }

    .tools-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .app-subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    .segment-tabs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .segment-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #e5e7eb;
      background: radial-gradient(circle at top, #020617, #020617);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .segment-tab.active {
      background: radial-gradient(circle at top, #4c1d95, #1d4ed8);
      border-color: rgba(191, 219, 254, 0.9);
      color: #f9fafb;
      box-shadow: 0 0 16px rgba(129, 140, 248, 0.6);
    }

    .segment-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(248, 250, 252, 0.8);
    }

    .tools-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 4px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tool-chip {
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: radial-gradient(circle at top, #020617, #020617);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 11px;
      color: #e5e7eb;
      text-align: center;
    }

    .tool-chip:hover {
      border-color: rgba(191, 219, 254, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.6);
    }

    .tool-chip.active {
      border-color: #f9a8d4;
      box-shadow: 0 0 14px rgba(244, 114, 182, 0.9);
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .tool-label {
      line-height: 1.2;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 12px;
    }

    .small-note {
      font-size: 11px;
      color: #6b7280;
    }

    .ghost-btn {
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), #020617);
      color: #e5e7eb;
    }

    .ghost-btn:hover {
      border-color: rgba(248, 250, 252, 0.8);
    }

    .btn-icon {
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(55, 65, 81, 0.8);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="camera-panel">
      <video id="videoElement" autoplay playsinline muted></video>
      <canvas id="canvasElement"></canvas>

      <div class="hint">
        <span class="hint-dot"></span>
        <span>Face tracking active ✨</span>
      </div>

      <div id="cameraError" class="camera-error" style="display: none;">
        无法访问摄像头 🥲<br>
        请检查浏览器的摄像头权限
      </div>
    </div>

    <div class="tools-panel">
      <header class="tools-header">
        <div class="app-title">AR Makeup Game</div>
        <div class="app-subtitle">Face tracking makeup effects</div>

        <div class="segment-tabs">
          <button class="segment-tab active" data-segment="lips">
            <span class="segment-dot"></span>
            Lips
          </button>
          <button class="segment-tab" data-segment="blush">Cheeks</button>
          <button class="segment-tab" data-segment="eyes">Eyes</button>
          <button class="segment-tab" data-segment="brows">Brows</button>
          <button class="segment-tab" data-segment="effects">Effects</button>
        </div>
      </header>

      <main class="tools-scroll" id="toolsArea"></main>

      <footer class="footer-actions">
        <div class="small-note">
          Real-time face tracking
        </div>
        <div>
          <button class="ghost-btn" id="clearAllBtn">
            <span class="btn-icon">🧴</span>
            清除妆容
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');
    const cameraError = document.getElementById('cameraError');

    // MediaPipe Face Mesh 关键点索引
    const FACE_LANDMARKS = {
      // 嘴唇轮廓 - 更精确
      lips: {
        upper: [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291],
        lower: [146, 91, 181, 84, 17, 314, 405, 321, 375, 61],
        outer: [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185]
      },
      // 眼影区域
      leftEye: [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246],
      rightEye: [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398],
      // 腮红区域 - 只在苹果肌中间
      leftCheek: [234, 93, 132, 58, 172],
      rightCheek: [454, 323, 361, 288, 397],
      // 眉毛区域
      leftBrow: [70, 63, 105, 66, 107, 55, 65, 52],
      rightBrow: [336, 296, 334, 293, 300, 285, 295, 282]
    };

    // 颜色配置
    const palettes = {
      lips: [
        { label: "Cherry", color: "rgba(227, 35, 86, 0.75)" },
        { label: "Rose", color: "rgba(214, 92, 124, 0.75)" },
        { label: "Coral", color: "rgba(244, 114, 82, 0.75)" },
        { label: "Plum", color: "rgba(147, 51, 234, 0.75)" },
        { label: "Brick", color: "rgba(185, 28, 28, 0.8)" },
        { label: "Soft Nude", color: "rgba(248, 187, 151, 0.85)" }
      ],
      blush: [
        { label: "Soft Pink", color: "rgba(248, 113, 166, 0.5)" },
        { label: "Warm Coral", color: "rgba(248, 153, 112, 0.5)" },
        { label: "Peach", color: "rgba(252, 211, 172, 0.6)" },
        { label: "Rose Flush", color: "rgba(225, 29, 72, 0.35)" }
      ],
      eyes: [
        { label: "Brown Nude", color: "rgba(88, 64, 44, 0.6)" },
        { label: "Cool Smoke", color: "rgba(55, 65, 81, 0.65)" },
        { label: "Soft Lilac", color: "rgba(167, 139, 250, 0.6)" },
        { label: "Gold Shimmer", color: "rgba(250, 204, 21, 0.45)" }
      ],
      brows: [
        { label: "Soft Brown", color: "rgba(87, 65, 39, 0.65)" },
        { label: "Dark Brown", color: "rgba(54, 36, 21, 0.7)" },
        { label: "Ash Brown", color: "rgba(80, 78, 74, 0.65)" },
        { label: "Natural Black", color: "rgba(20, 20, 20, 0.7)" }
      ],
      effects: [
        { label: "Bunny Ears", type: "bunny", color: "rgba(255, 192, 203, 0.9)" },
        { label: "Cat Ears", type: "cat", color: "rgba(139, 69, 19, 0.9)" }
      ]
    };

    let activeSegment = "lips";
    let activeSelections = { lips: null, blush: null, eyes: null, brows: null, effects: null };
    let currentMakeup = { lips: null, blush: null, eyes: null, brows: null, effects: null };

    // 绘制多边形
    function drawPolygon(ctx, points, color) {
      if (!points || points.length === 0) return;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
      ctx.fill();
    }

    // 把 rgba 里的透明度改掉，例如 setAlpha("rgba(80,78,74,0.7)", 0.3)
    function setAlpha(color, alpha) {
      const match = color.match(/rgba?\(([^)]+)\)/);
      if (!match) return color;
      const parts = match[1].split(',').map(p => p.trim());
      const r = parts[0], g = parts[1], b = parts[2];
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 绘制兔子耳朵
    function drawBunnyEars(ctx, landmarks, w, h) {
      // 使用头部顶部和侧面的 landmarks 来定位耳朵
      const topHead = landmarks[10];  // 头顶
      const leftSide = landmarks[234]; // 左脸颊
      const rightSide = landmarks[454]; // 右脸颊

      const headWidth = Math.abs(leftSide.x - rightSide.x) * w;
      const earWidth = headWidth * 0.15;
      const earHeight = headWidth * 0.35;

      function drawBunnyEar(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // 外耳 - 粉色
        ctx.fillStyle = "rgba(255, 192, 203, 0.95)";
        ctx.beginPath();
        ctx.ellipse(0, 0, earWidth * 0.5, earHeight, 0, 0, Math.PI * 2);
        ctx.fill();

        // 内耳 - 浅粉色
        ctx.fillStyle = "rgba(255, 228, 225, 0.9)";
        ctx.beginPath();
        ctx.ellipse(0, earHeight * 0.1, earWidth * 0.3, earHeight * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 耳朵边缘
        ctx.strokeStyle = "rgba(255, 182, 193, 1)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, earWidth * 0.5, earHeight, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      // 左耳
      const leftEarX = (topHead.x - 0.12) * w;
      const leftEarY = (topHead.y - 0.15) * h;
      drawBunnyEar(leftEarX, leftEarY);

      // 右耳
      const rightEarX = (topHead.x + 0.12) * w;
      const rightEarY = (topHead.y - 0.15) * h;
      drawBunnyEar(rightEarX, rightEarY);
    }

    // 绘制猫耳朵
    function drawCatEars(ctx, landmarks, w, h) {
      const topHead = landmarks[10];
      const leftSide = landmarks[234];
      const rightSide = landmarks[454];

      const headWidth = Math.abs(leftSide.x - rightSide.x) * w;
      const earSize = headWidth * 0.18;

      function drawCatEar(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // 外耳 - 三角形
        ctx.fillStyle = "rgba(139, 69, 19, 0.95)";
        ctx.beginPath();
        ctx.moveTo(0, -earSize);
        ctx.lineTo(-earSize * 0.6, earSize * 0.3);
        ctx.lineTo(earSize * 0.6, earSize * 0.3);
        ctx.closePath();
        ctx.fill();

        // 内耳 - 粉色三角
        ctx.fillStyle = "rgba(255, 192, 203, 0.8)";
        ctx.beginPath();
        ctx.moveTo(0, -earSize * 0.6);
        ctx.lineTo(-earSize * 0.35, earSize * 0.1);
        ctx.lineTo(earSize * 0.35, earSize * 0.1);
        ctx.closePath();
        ctx.fill();

        // 边缘
        ctx.strokeStyle = "rgba(101, 67, 33, 1)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -earSize);
        ctx.lineTo(-earSize * 0.6, earSize * 0.3);
        ctx.lineTo(earSize * 0.6, earSize * 0.3);
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
      }

      // 左耳
      const leftEarX = (topHead.x - 0.14) * w;
      const leftEarY = (topHead.y - 0.12) * h;
      drawCatEar(leftEarX, leftEarY);

      // 右耳
      const rightEarX = (topHead.x + 0.14) * w;
      const rightEarY = (topHead.y - 0.12) * h;
      drawCatEar(rightEarX, rightEarY);
    }

    // 获取关键点坐标（支持区域放大）
    function getLandmarkPoints(landmarks, indices, width, height, expand = 1.0) {
      const points = indices.map(index => ({
        x: landmarks[index].x * width,
        y: landmarks[index].y * height
      }));

      if (expand === 1.0) return points;

      // 计算中心点
      const centerX = points.reduce((sum, p) => sum + p.x, 0) / points.length;
      const centerY = points.reduce((sum, p) => sum + p.y, 0) / points.length;

      // 从中心点向外扩展
      return points.map(p => ({
        x: centerX + (p.x - centerX) * expand,
        y: centerY + (p.y - centerY) * expand
      }));
    }

    // MediaPipe Face Mesh 回调
    function onResults(results) {
      // 用 FaceMesh 返回的 image 尺寸来当基准
      const image = results.image;
      if (!image) return;

      const w = image.width;
      const h = image.height;

      canvasElement.width  = w;
      canvasElement.height = h;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      // 先把视频帧画上来，再叠加妆容
      canvasCtx.drawImage(image, 0, 0, w, h);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // 让妆容和皮肤融合一点
        canvasCtx.globalCompositeOperation = "soft-light";

        // 嘴唇
        if (currentMakeup.lips) {
          const outerLip = getLandmarkPoints(
            landmarks,
            FACE_LANDMARKS.lips.outer,
            w, h,
            1.05 // 稍微放大一点
          );
          drawPolygon(canvasCtx, outerLip, currentMakeup.lips);
        }

        // 眼影
        if (currentMakeup.eyes) {
          const leftEye  = getLandmarkPoints(landmarks, FACE_LANDMARKS.leftEye,  w, h, 1.15);
          const rightEye = getLandmarkPoints(landmarks, FACE_LANDMARKS.rightEye, w, h, 1.15);
          drawPolygon(canvasCtx, leftEye,  currentMakeup.eyes);
          drawPolygon(canvasCtx, rightEye, currentMakeup.eyes);
        }

        // 腮红：左右各一块椭圆，中心深、边缘淡
        if (currentMakeup.blush) {
          // 使用 234 / 454 作为苹果肌中心
          const left  = landmarks[234];
          const right = landmarks[454];

          function drawBlushOval(landmark, side, baseColor) {
            // 基础中心点
            let cx = landmark.x * w;
            let cy = landmark.y * h;

            // 腮红稍微往上提一点点，靠近眼睛下面
            cy -= 0.02 * h;

            // 不再往侧面推那么多，只轻微往中间集中
            const offsetX = 0.01 * w;  // 原来是 0.018
            if (side === 'left')  cx += offsetX;   // 往脸中央一点
            if (side === 'right') cx -= offsetX;

            // 范围再缩小一点，让腮红更集中在脸颊中央
            const radiusX = 0.045 * w;   // 原来是 0.055
            const radiusY = 0.035 * h;   // 原来是 0.04

            canvasCtx.save();
            canvasCtx.translate(cx, cy);
            canvasCtx.scale(radiusX, radiusY);

            const grad = canvasCtx.createRadialGradient(0, 0, 0, 0, 0, 1);
            grad.addColorStop(0.0, setAlpha(baseColor, 0.8));   // 中间深
            grad.addColorStop(0.45, setAlpha(baseColor, 0.5));
            grad.addColorStop(1.0, setAlpha(baseColor, 0.0));   // 外圈完全透明

            canvasCtx.fillStyle = grad;
            canvasCtx.beginPath();
            canvasCtx.arc(0, 0, 1, 0, Math.PI * 2);
            canvasCtx.fill();
            canvasCtx.restore();
          }

          drawBlushOval(left,  'left',  currentMakeup.blush);
          drawBlushOval(right, 'right', currentMakeup.blush);
        }

        // 眉毛：沿着眉骨，用线性渐变做由浅到深
        if (currentMakeup.brows) {
          const leftBrowPts  = getLandmarkPoints(
            landmarks, FACE_LANDMARKS.leftBrow,  w, h, 0.9   // 收小避免分叉
          );
          const rightBrowPts = getLandmarkPoints(
            landmarks, FACE_LANDMARKS.rightBrow, w, h, 0.9
          );

          function drawGradientBrow(points, baseColor) {
            // 先算一个 bounding box
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            points.forEach(p => {
              if (p.x < minX) minX = p.x;
              if (p.x > maxX) maxX = p.x;
              if (p.y < minY) minY = p.y;
              if (p.y > maxY) maxY = p.y;
            });

            const width  = maxX - minX;
            const height = maxY - minY;

            canvasCtx.save();
            // 建一个 polygon 作为 clip 区域
            canvasCtx.beginPath();
            canvasCtx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
              canvasCtx.lineTo(points[i].x, points[i].y);
            }
            canvasCtx.closePath();
            canvasCtx.clip();

            // 眉头 → 眉尾 做线性渐变
            const grad = canvasCtx.createLinearGradient(minX, minY, maxX, minY);
            grad.addColorStop(0.0, setAlpha(baseColor, 0.20)); // 眉头很柔
            grad.addColorStop(0.45, setAlpha(baseColor, 0.75)); // 中段最深
            grad.addColorStop(1.0, setAlpha(baseColor, 0.35));  // 尾部再淡一点

            canvasCtx.fillStyle = grad;
            // 在 clip 里画一个矩形就可以，颜色会被裁成眉毛形状
            canvasCtx.fillRect(minX, minY - height * 0.2, width, height * 1.4);

            canvasCtx.restore();
          }

          drawGradientBrow(leftBrowPts,  currentMakeup.brows);
          drawGradientBrow(rightBrowPts, currentMakeup.brows);
        }

        canvasCtx.globalCompositeOperation = "source-over";

        // 特效：耳朵（在妆容之后绘制，使用 source-over）
        if (currentMakeup.effects) {
          if (currentMakeup.effects.type === 'bunny') {
            drawBunnyEars(canvasCtx, landmarks, w, h);
          } else if (currentMakeup.effects.type === 'cat') {
            drawCatEars(canvasCtx, landmarks, w, h);
          }
        }
      }

      canvasCtx.restore();
    }

    // 初始化 Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
      }
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // 初始化摄像头
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 1280, height: 720 },
          audio: false
        });
        videoElement.srcObject = stream;

        videoElement.onloadedmetadata = () => {
          const camera = new Camera(videoElement, {
            onFrame: async () => {
              await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
          });
          camera.start();
        };
      } catch (err) {
        console.error('Camera error:', err);
        cameraError.style.display = 'flex';
      }
    }

    // UI 逻辑
    const toolsArea = document.getElementById('toolsArea');
    const segmentTabs = document.querySelectorAll('.segment-tab');

    function renderPalette(segment) {
      toolsArea.innerHTML = '';

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.textContent =
        segment === 'lips' ? 'Lip Colors' :
        segment === 'blush' ? 'Blush Shades' :
        segment === 'eyes' ? 'Eyeshadow' :
        segment === 'brows' ? 'Brow Colors' :
        'Fun Effects';

      const paletteGrid = document.createElement('div');
      paletteGrid.className = 'palette';

      palettes[segment].forEach((item, index) => {
        const chip = document.createElement('button');
        chip.className = 'tool-chip';
        if (activeSelections[segment] === index) {
          chip.classList.add('active');
        }

        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = item.color;

        const label = document.createElement('div');
        label.className = 'tool-label';
        label.textContent = item.label;

        chip.appendChild(dot);
        chip.appendChild(label);

        chip.addEventListener('click', () => {
          activeSelections[segment] = index;
          if (segment === 'effects') {
            currentMakeup[segment] = item;  // 保存整个 item 对象（包含 type）
          } else {
            currentMakeup[segment] = item.color;
          }
          renderPalette(segment);
        });

        paletteGrid.appendChild(chip);
      });

      toolsArea.appendChild(sectionTitle);
      toolsArea.appendChild(paletteGrid);
    }

    function setActiveSegment(segment) {
      activeSegment = segment;
      segmentTabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.segment === segment);
      });
      renderPalette(segment);
    }

    segmentTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const segment = tab.dataset.segment;
        if (segment && segment !== activeSegment) {
          setActiveSegment(segment);
        }
      });
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      currentMakeup = { lips: null, blush: null, eyes: null, brows: null, effects: null };
      activeSelections = { lips: null, blush: null, eyes: null, brows: null, effects: null };
      renderPalette(activeSegment);
    });

    // 启动
    setActiveSegment('lips');
    initCamera();
  </script>
</body>
</html>
