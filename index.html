<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Makeup Mini Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: #f9fafb;
    }

    .app {
      width: min(1100px, 100vw - 24px);
      height: min(650px, 100vh - 24px);
      background: #020617;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
    }

    /* 左侧摄像头区域 */
    .camera-panel {
      position: relative;
      flex: 3;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #020617;
    }

    .camera-overlay {
      position: absolute;
      inset: 16px;
      pointer-events: none;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .face-guide {
      position: absolute;
      inset: 16% 22%;
      border-radius: 50%;
      border: 1px dashed rgba(248, 250, 252, 0.4);
      pointer-events: none;
    }

    .hint {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .camera-error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      background: radial-gradient(circle at top, #111827, #020617);
    }

    /* 妆容遮罩层 */
    .overlay-layer {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, background-color 0.25s ease;
      mix-blend-mode: screen;
    }

    .overlay-visible {
      opacity: 0.9;
    }

    /* 位置是大概的，需要自己把脸对上去 😂 */
    .overlay-lips {
      width: 18%;
      height: 9%;
      border-radius: 999px;
      bottom: 23%;
      left: 41%;
    }

    .overlay-cheek {
      width: 12%;
      height: 10%;
      border-radius: 50%;
    }

    .overlay-cheek-left {
      bottom: 34%;
      left: 27%;
    }

    .overlay-cheek-right {
      bottom: 34%;
      right: 27%;
    }

    .overlay-eyeshadow {
      width: 32%;
      height: 12%;
      border-radius: 50%;
      bottom: 39%;
      left: 34%;
    }

    /* 右侧工具栏 */
    .tools-panel {
      flex: 2;
      background: linear-gradient(145deg, #020617, #020617, #111827);
      padding: 18px 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-left: 1px solid rgba(30, 64, 175, 0.4);
    }

    .tools-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .app-subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    .segment-tabs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .segment-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #e5e7eb;
      background: radial-gradient(circle at top, #020617, #020617);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .segment-tab.active {
      background: radial-gradient(circle at top, #4c1d95, #1d4ed8);
      border-color: rgba(191, 219, 254, 0.9);
      color: #f9fafb;
      box-shadow: 0 0 16px rgba(129, 140, 248, 0.6);
    }

    .segment-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(248, 250, 252, 0.8);
    }

    .tools-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 4px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tool-chip {
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: radial-gradient(circle at top, #020617, #020617);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 11px;
      color: #e5e7eb;
      text-align: center;
    }

    .tool-chip:hover {
      border-color: rgba(191, 219, 254, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.6);
    }

    .tool-chip.active {
      border-color: #f9a8d4;
      box-shadow: 0 0 14px rgba(244, 114, 182, 0.9);
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .tool-label {
      line-height: 1.2;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 12px;
    }

    .small-note {
      font-size: 11px;
      color: #6b7280;
    }

    .primary-btn,
    .ghost-btn {
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid transparent;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      background: none;
      color: inherit;
    }

    .primary-btn {
      background: radial-gradient(circle at top, #4c1d95, #1d4ed8);
      border-color: rgba(191, 219, 254, 0.9);
      color: #f9fafb;
      box-shadow: 0 15px 30px rgba(55, 48, 163, 0.7);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 40px rgba(55, 48, 163, 0.9);
    }

    .ghost-btn {
      border-color: rgba(148, 163, 184, 0.4);
      color: #e5e7eb;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), #020617);
    }

    .ghost-btn:hover {
      border-color: rgba(248, 250, 252, 0.8);
    }

    .btn-icon {
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(55, 65, 81, 0.8);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧：摄像头 + 妆容遮罩 -->
    <div class="camera-panel">
      <video id="camera" autoplay playsinline muted></video>

      <div class="camera-overlay">
        <div class="face-guide"></div>
        <div class="hint">
          <span class="hint-dot"></span>
          <span>把脸放在虚线圈里试试不同妆容</span>
        </div>

        <!-- 妆容遮罩层（大概位置，需要自己对齐 😊） -->
        <div
          class="overlay-layer overlay-lips"
          data-layer="lips"
        ></div>
        <div
          class="overlay-layer overlay-cheek overlay-cheek-left"
          data-layer="blush"
        ></div>
        <div
          class="overlay-layer overlay-cheek overlay-cheek-right"
          data-layer="blush"
        ></div>
        <div
          class="overlay-layer overlay-eyeshadow"
          data-layer="eyeshadow"
        ></div>
      </div>

      <div id="cameraError" class="camera-error" style="display: none;">
        无法访问摄像头 🥲
        请检查浏览器的摄像头权限，或换一个支持的浏览器再试一次。
      </div>
    </div>

    <!-- 右侧：化妆工具 -->
    <div class="tools-panel">
      <header class="tools-header">
        <div class="app-title">AR Makeup Mini Game</div>
        <div class="app-subtitle">选择化妆品，让镜头里的你立刻变妆 ✨</div>

        <div class="segment-tabs">
          <button class="segment-tab active" data-segment="lips">
            <span class="segment-dot"></span>
            Lips
          </button>
          <button class="segment-tab" data-segment="blush">Cheeks</button>
          <button class="segment-tab" data-segment="eyes">Eyes</button>
        </div>
      </header>

      <main class="tools-scroll" id="toolsArea">
        <!-- 这里的内容由 JS 根据选中的 segment 填充 -->
      </main>

      <footer class="footer-actions">
        <div class="small-note">
          提示：和现实化妆一样，不要一下子用太多颜色 😆
        </div>
        <div>
          <button class="ghost-btn" id="clearAllBtn">
            <span class="btn-icon">🧴</span>
            清除妆容
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    // --- 摄像头初始化 ---
    const videoEl = document.getElementById("camera");
    const cameraError = document.getElementById("cameraError");

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false,
        });
        videoEl.srcObject = stream;
      } catch (err) {
        console.error("Camera error:", err);
        cameraError.style.display = "flex";
      }
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      initCamera();
    } else {
      cameraError.style.display = "flex";
    }

    // --- 工具数据 ---
    const palettes = {
      lips: [
        {
          label: "Cherry",
          color: "rgba(227, 35, 86, 0.8)",
        },
        {
          label: "Rose",
          color: "rgba(214, 92, 124, 0.8)",
        },
        {
          label: "Coral",
          color: "rgba(244, 114, 82, 0.8)",
        },
        {
          label: "Plum",
          color: "rgba(147, 51, 234, 0.8)",
        },
        {
          label: "Brick",
          color: "rgba(185, 28, 28, 0.85)",
        },
        {
          label: "Soft Nude",
          color: "rgba(248, 187, 151, 0.9)",
        },
      ],
      blush: [
        {
          label: "Soft Pink",
          color: "rgba(248, 113, 166, 0.7)",
        },
        {
          label: "Warm Coral",
          color: "rgba(248, 153, 112, 0.7)",
        },
        {
          label: "Peach",
          color: "rgba(252, 211, 172, 0.8)",
        },
        {
          label: "Rose Flush",
          color: "rgba(225, 29, 72, 0.4)",
        },
      ],
      eyes: [
        {
          label: "Brown Nude",
          color: "rgba(88, 64, 44, 0.7)",
        },
        {
          label: "Cool Smoke",
          color: "rgba(55, 65, 81, 0.75)",
        },
        {
          label: "Soft Lilac",
          color: "rgba(167, 139, 250, 0.7)",
        },
        {
          label: "Gold Shimmer",
          color: "rgba(250, 204, 21, 0.55)",
        },
      ],
    };

    const toolsArea = document.getElementById("toolsArea");
    const segmentTabs = document.querySelectorAll(".segment-tab");
    let activeSegment = "lips";
    let activeSelections = {
      lips: null,
      blush: null,
      eyes: null,
    };

    function renderPalette(segment) {
      toolsArea.innerHTML = "";

      const sectionTitle = document.createElement("div");
      sectionTitle.className = "section-title";
      sectionTitle.textContent =
        segment === "lips"
          ? "Lip Colors"
          : segment === "blush"
          ? "Blush Shades"
          : "Eyeshadow";

      const paletteGrid = document.createElement("div");
      paletteGrid.className = "palette";

      palettes[segment].forEach((item, index) => {
        const chip = document.createElement("button");
        chip.className = "tool-chip";
        chip.dataset.segment = segment;
        chip.dataset.index = index.toString();
        chip.dataset.color = item.color;
        chip.dataset.label = item.label;

        if (activeSelections[segment] === index) {
          chip.classList.add("active");
        }

        const dot = document.createElement("div");
        dot.className = "color-dot";
        dot.style.background = item.color;

        const label = document.createElement("div");
        label.className = "tool-label";
        label.textContent = item.label;

        chip.appendChild(dot);
        chip.appendChild(label);

        chip.addEventListener("click", () => {
          activeSelections[segment] = index;
          applyMakeup(segment, item.color);
          renderPalette(segment);
        });

        paletteGrid.appendChild(chip);
      });

      toolsArea.appendChild(sectionTitle);
      toolsArea.appendChild(paletteGrid);
    }

    function setActiveSegment(segment) {
      activeSegment = segment;
      segmentTabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.segment === segment);
      });
      renderPalette(segment);
    }

    segmentTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const segment = tab.dataset.segment;
        if (segment && segment !== activeSegment) {
          setActiveSegment(segment);
        }
      });
    });

    // 初始显示 Lips
    setActiveSegment("lips");

    // --- 应用妆容函数 ---
    function applyMakeup(segment, color) {
      let layerName;
      if (segment === "lips") {
        layerName = "lips";
      } else if (segment === "blush") {
        layerName = "blush";
      } else if (segment === "eyes") {
        layerName = "eyeshadow";
      }

      if (!layerName) return;

      const layers = document.querySelectorAll(
        `.overlay-layer[data-layer="${layerName}"]`
      );

      layers.forEach((layer) => {
        layer.style.backgroundColor = color;
        layer.classList.add("overlay-visible");
      });
    }

    // --- 清除妆容 ---
    const clearBtn = document.getElementById("clearAllBtn");

    clearBtn.addEventListener("click", () => {
      const layers = document.querySelectorAll(".overlay-layer");
      layers.forEach((layer) => {
        layer.classList.remove("overlay-visible");
        layer.style.backgroundColor = "transparent";
      });
      activeSelections = { lips: null, blush: null, eyes: null };
      renderPalette(activeSegment);
    });
  </script>
</body>
</html>
