<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Makeup Mini Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: #f9fafb;
    }

    .app {
      width: min(1100px, 100vw - 24px);
      height: min(650px, 100vh - 24px);
      background: #020617;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
    }

    .camera-panel {
      position: relative;
      flex: 3;
      background: #000;
      overflow: hidden;
    }

    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* 隐藏，只用 canvas 显示 */
    }

    #canvasElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hint {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .camera-error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      background: radial-gradient(circle at top, #111827, #020617);
      z-index: 100;
    }

    .tools-panel {
      flex: 2;
      background: linear-gradient(145deg, #020617, #020617, #111827);
      padding: 18px 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-left: 1px solid rgba(30, 64, 175, 0.4);
    }

    .tools-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .app-subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    .segment-tabs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .segment-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #e5e7eb;
      background: radial-gradient(circle at top, #020617, #020617);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .segment-tab.active {
      background: radial-gradient(circle at top, #4c1d95, #1d4ed8);
      border-color: rgba(191, 219, 254, 0.9);
      color: #f9fafb;
      box-shadow: 0 0 16px rgba(129, 140, 248, 0.6);
    }

    .segment-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(248, 250, 252, 0.8);
    }

    .tools-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 4px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tool-chip {
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: radial-gradient(circle at top, #020617, #020617);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 11px;
      color: #e5e7eb;
      text-align: center;
    }

    .tool-chip:hover {
      border-color: rgba(191, 219, 254, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.6);
    }

    .tool-chip.active {
      border-color: #f9a8d4;
      box-shadow: 0 0 14px rgba(244, 114, 182, 0.9);
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .tool-label {
      line-height: 1.2;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 12px;
    }

    .small-note {
      font-size: 11px;
      color: #6b7280;
    }

    .ghost-btn {
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), #020617);
      color: #e5e7eb;
    }

    .ghost-btn:hover {
      border-color: rgba(248, 250, 252, 0.8);
    }

    .btn-icon {
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(55, 65, 81, 0.8);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="camera-panel">
      <video id="videoElement" autoplay playsinline muted></video>
      <canvas id="canvasElement"></canvas>

      <div class="hint">
        <span class="hint-dot"></span>
        <span>Face tracking active ✨</span>
      </div>

      <div id="cameraError" class="camera-error" style="display: none;">
        无法访问摄像头 🥲<br>
        请检查浏览器的摄像头权限
      </div>
    </div>

    <div class="tools-panel">
      <header class="tools-header">
        <div class="app-title">AR Makeup Game</div>
        <div class="app-subtitle">Face tracking makeup effects</div>

        <div class="segment-tabs">
          <button class="segment-tab active" data-segment="lips">
            <span class="segment-dot"></span>
            Lips
          </button>
          <button class="segment-tab" data-segment="blush">Cheeks</button>
          <button class="segment-tab" data-segment="eyes">Eyes</button>
          <button class="segment-tab" data-segment="brows">Brows</button>
          <button class="segment-tab" data-segment="effects">Effects</button>
        </div>
      </header>

      <main class="tools-scroll" id="toolsArea"></main>

      <footer class="footer-actions">
        <div class="small-note">
          Real-time face tracking
        </div>
        <div>
          <button class="ghost-btn" id="clearAllBtn">
            <span class="btn-icon">🧴</span>
            清除妆容
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');
    const cameraError = document.getElementById('cameraError');

    // MediaPipe Face Mesh 关键点索引
    const FACE_LANDMARKS = {
      // 嘴唇轮廓 - 更精确
      lips: {
        upper: [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291],
        lower: [146, 91, 181, 84, 17, 314, 405, 321, 375, 61],
        outer: [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185]
      },
      // 眼影区域
      leftEye: [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246],
      rightEye: [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398],
      // 腮红区域 - 只在苹果肌中间
      leftCheek: [234, 93, 132, 58, 172],
      rightCheek: [454, 323, 361, 288, 397],
      // 眉毛区域
      leftBrow: [70, 63, 105, 66, 107, 55, 65, 52],
      rightBrow: [336, 296, 334, 293, 300, 285, 295, 282]
    };

    // 颜色配置
    const palettes = {
      lips: [
        { label: "Cherry", color: "rgba(227, 35, 86, 0.75)" },
        { label: "Rose", color: "rgba(214, 92, 124, 0.75)" },
        { label: "Coral", color: "rgba(244, 114, 82, 0.75)" },
        { label: "Plum", color: "rgba(147, 51, 234, 0.75)" },
        { label: "Brick", color: "rgba(185, 28, 28, 0.8)" },
        { label: "Soft Nude", color: "rgba(248, 187, 151, 0.85)" }
      ],
      blush: [
        { label: "Soft Pink", color: "rgba(248, 113, 166, 0.5)" },
        { label: "Warm Coral", color: "rgba(248, 153, 112, 0.5)" },
        { label: "Peach", color: "rgba(252, 211, 172, 0.6)" },
        { label: "Rose Flush", color: "rgba(225, 29, 72, 0.35)" }
      ],
      eyes: [
        { label: "Brown Nude", color: "rgba(88, 64, 44, 0.6)" },
        { label: "Cool Smoke", color: "rgba(55, 65, 81, 0.65)" },
        { label: "Soft Lilac", color: "rgba(167, 139, 250, 0.6)" },
        { label: "Gold Shimmer", color: "rgba(250, 204, 21, 0.45)" }
      ],
      brows: [
        { label: "Soft Brown", color: "rgba(87, 65, 39, 0.65)" },
        { label: "Dark Brown", color: "rgba(54, 36, 21, 0.7)" },
        { label: "Ash Brown", color: "rgba(80, 78, 74, 0.65)" },
        { label: "Natural Black", color: "rgba(20, 20, 20, 0.7)" }
      ],
      effects: [
        { label: "Bunny Ears", type: "bunny", color: "rgba(255, 192, 203, 0.9)" },
        { label: "Cat Ears", type: "cat", color: "rgba(139, 69, 19, 0.9)" }
      ]
    };

    let activeSegment = "lips";
    let activeSelections = { lips: null, blush: null, eyes: null, brows: null, effects: null };
    let currentMakeup = { lips: null, blush: null, eyes: null, brows: null, effects: null };

    // 新增特效状态（可以多选）
    let activeEffects = {
      catEars: false,
      cheekSparkles: false,
      heartUnderEyes: false,
      softVignette: false,
      floatingShapes: false
    };

    // 绘制多边形
    function drawPolygon(ctx, points, color) {
      if (!points || points.length === 0) return;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
      ctx.fill();
    }

    // 把 rgba 里的透明度改掉，例如 setAlpha("rgba(80,78,74,0.7)", 0.3)
    function setAlpha(color, alpha) {
      const match = color.match(/rgba?\(([^)]+)\)/);
      if (!match) return color;
      const parts = match[1].split(',').map(p => p.trim());
      const r = parts[0], g = parts[1], b = parts[2];
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 绘制兔子耳朵
    function drawBunnyEars(ctx, landmarks, w, h) {
      // 使用头部顶部和侧面的 landmarks 来定位耳朵
      const topHead = landmarks[10];  // 头顶
      const leftSide = landmarks[234]; // 左脸颊
      const rightSide = landmarks[454]; // 右脸颊

      const headWidth = Math.abs(leftSide.x - rightSide.x) * w;
      const earWidth = headWidth * 0.15;
      const earHeight = headWidth * 0.35;

      function drawBunnyEar(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // 外耳 - 粉色
        ctx.fillStyle = "rgba(255, 192, 203, 0.95)";
        ctx.beginPath();
        ctx.ellipse(0, 0, earWidth * 0.5, earHeight, 0, 0, Math.PI * 2);
        ctx.fill();

        // 内耳 - 浅粉色
        ctx.fillStyle = "rgba(255, 228, 225, 0.9)";
        ctx.beginPath();
        ctx.ellipse(0, earHeight * 0.1, earWidth * 0.3, earHeight * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 耳朵边缘
        ctx.strokeStyle = "rgba(255, 182, 193, 1)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, earWidth * 0.5, earHeight, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      // 左耳
      const leftEarX = (topHead.x - 0.12) * w;
      const leftEarY = (topHead.y - 0.15) * h;
      drawBunnyEar(leftEarX, leftEarY);

      // 右耳
      const rightEarX = (topHead.x + 0.12) * w;
      const rightEarY = (topHead.y - 0.15) * h;
      drawBunnyEar(rightEarX, rightEarY);
    }

    // 绘制猫耳朵
    function drawCatEars(ctx, landmarks, w, h) {
      const topHead = landmarks[10];
      const leftSide = landmarks[234];
      const rightSide = landmarks[454];

      const headWidth = Math.abs(leftSide.x - rightSide.x) * w;
      const earSize = headWidth * 0.18;

      function drawCatEar(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // 外耳 - 三角形
        ctx.fillStyle = "rgba(139, 69, 19, 0.95)";
        ctx.beginPath();
        ctx.moveTo(0, -earSize);
        ctx.lineTo(-earSize * 0.6, earSize * 0.3);
        ctx.lineTo(earSize * 0.6, earSize * 0.3);
        ctx.closePath();
        ctx.fill();

        // 内耳 - 粉色三角
        ctx.fillStyle = "rgba(255, 192, 203, 0.8)";
        ctx.beginPath();
        ctx.moveTo(0, -earSize * 0.6);
        ctx.lineTo(-earSize * 0.35, earSize * 0.1);
        ctx.lineTo(earSize * 0.35, earSize * 0.1);
        ctx.closePath();
        ctx.fill();

        // 边缘
        ctx.strokeStyle = "rgba(101, 67, 33, 1)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -earSize);
        ctx.lineTo(-earSize * 0.6, earSize * 0.3);
        ctx.lineTo(earSize * 0.6, earSize * 0.3);
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
      }

      // 左耳
      const leftEarX = (topHead.x - 0.14) * w;
      const leftEarY = (topHead.y - 0.12) * h;
      drawCatEar(leftEarX, leftEarY);

      // 右耳
      const rightEarX = (topHead.x + 0.14) * w;
      const rightEarY = (topHead.y - 0.12) * h;
      drawCatEar(rightEarX, rightEarY);
    }

    // 获取关键点坐标（支持区域放大）
    function getLandmarkPoints(landmarks, indices, width, height, expand = 1.0) {
      const points = indices.map(index => ({
        x: landmarks[index].x * width,
        y: landmarks[index].y * height
      }));

      if (expand === 1.0) return points;

      // 计算中心点
      const centerX = points.reduce((sum, p) => sum + p.x, 0) / points.length;
      const centerY = points.reduce((sum, p) => sum + p.y, 0) / points.length;

      // 从中心点向外扩展
      return points.map(p => ({
        x: centerX + (p.x - centerX) * expand,
        y: centerY + (p.y - centerY) * expand
      }));
    }

    // MediaPipe Face Mesh 回调
    function onResults(results) {
      // 用 FaceMesh 返回的 image 尺寸来当基准
      const image = results.image;
      if (!image) return;

      const w = image.width;
      const h = image.height;

      canvasElement.width  = w;
      canvasElement.height = h;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      // 先把视频帧画上来，再叠加妆容
      canvasCtx.drawImage(image, 0, 0, w, h);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // 让妆容和皮肤融合一点
        canvasCtx.globalCompositeOperation = "soft-light";

        // 嘴唇
        if (currentMakeup.lips) {
          const outerLip = getLandmarkPoints(
            landmarks,
            FACE_LANDMARKS.lips.outer,
            w, h,
            1.05 // 稍微放大一点
          );
          drawPolygon(canvasCtx, outerLip, currentMakeup.lips);
        }

        // 眼影
        if (currentMakeup.eyes) {
          const leftEye  = getLandmarkPoints(landmarks, FACE_LANDMARKS.leftEye,  w, h, 1.15);
          const rightEye = getLandmarkPoints(landmarks, FACE_LANDMARKS.rightEye, w, h, 1.15);
          drawPolygon(canvasCtx, leftEye,  currentMakeup.eyes);
          drawPolygon(canvasCtx, rightEye, currentMakeup.eyes);
        }

        // 腮红：左右各一块椭圆，中心深、边缘淡
        if (currentMakeup.blush) {
          // 使用 234 / 454 作为苹果肌中心
          const left  = landmarks[234];
          const right = landmarks[454];

          function drawBlushOval(landmark, side, baseColor) {
            // landmark：234（左） / 454（右）
            let cx = landmark.x * w;
            let cy = landmark.y * h;

            // 腮红稍微往上提一点点（靠近眼睛下方）
            cy -= 0.015 * h;

            // 往两侧拉开，让它铺满整个脸颊
            const offsetX = 0.03 * w;  // 往外扩
            if (side === 'left')  cx -= offsetX;   // 左脸往左一点（靠耳朵方向）
            if (side === 'right') cx += offsetX;   // 右脸往右一点

            // 腮红范围加大：横向宽、纵向也略大
            const radiusX = 0.09 * w;   // 原来更小，现在几乎整个脸颊
            const radiusY = 0.06 * h;

            canvasCtx.save();
            canvasCtx.translate(cx, cy);
            canvasCtx.scale(radiusX, radiusY);

            // 中心深、边缘淡的径向渐变
            const grad = canvasCtx.createRadialGradient(0, 0, 0, 0, 0, 1);
            grad.addColorStop(0.0, setAlpha(baseColor, 0.75));  // 苹果肌中心
            grad.addColorStop(0.4, setAlpha(baseColor, 0.45));
            grad.addColorStop(1.0, setAlpha(baseColor, 0.0));   // 外圈透明

            canvasCtx.fillStyle = grad;
            canvasCtx.beginPath();
            canvasCtx.arc(0, 0, 1, 0, Math.PI * 2);
            canvasCtx.fill();
            canvasCtx.restore();
          }

          drawBlushOval(left,  'left',  currentMakeup.blush);
          drawBlushOval(right, 'right', currentMakeup.blush);
        }

        // 眉毛：画成卡通弧线眉（前粗后细、上弯）
        if (currentMakeup.brows) {
          function drawStylizedBrow(indices, baseColor) {
            const pts = getLandmarkPoints(landmarks, indices, w, h, 1.0);

            // 取 landmark 的整体范围
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            pts.forEach(p => {
              if (p.x < minX) minX = p.x;
              if (p.x > maxX) maxX = p.x;
              if (p.y < minY) minY = p.y;
              if (p.y > maxY) maxY = p.y;
            });

            const width  = maxX - minX;
            const height = maxY - minY;

            // 眉毛大概中心位置
            const baseY   = minY + height * 0.1;         // 靠近原本眉骨
            const startX  = minX - width * 0.05;         // 眉头稍微再往前一点
            const endX    = maxX + width * 0.05;         // 眉尾稍微再长一点
            const midX    = (startX + endX) / 2;

            // 弯曲程度和厚度
            const arch    = height * 0.8;                // 眉峰高度
            const thickHead = height * 0.7;              // 眉头粗
            const thickTail = height * 0.3;              // 眉尾细

            canvasCtx.save();

            // 顶部轮廓：从眉头到眉尾的弧线
            canvasCtx.beginPath();
            canvasCtx.moveTo(startX, baseY);
            canvasCtx.quadraticCurveTo(
              midX, baseY - arch,  // 眉峰抬起
              endX, baseY - arch * 0.4
            );

            // 底部轮廓：从眉尾返回眉头，厚度渐变
            // 在上弧线基础上往下偏移（眉尾更细）
            canvasCtx.quadraticCurveTo(
              midX, baseY - arch * 0.2 + thickTail,
              startX, baseY + thickHead
            );

            canvasCtx.closePath();

            // 做一个前浅后深的线性渐变
            const grad = canvasCtx.createLinearGradient(startX, baseY, endX, baseY);
            grad.addColorStop(0.0, setAlpha(baseColor, 0.25));  // 眉头淡
            grad.addColorStop(0.35, setAlpha(baseColor, 0.6));
            grad.addColorStop(0.7, setAlpha(baseColor, 0.9));   // 中后段最深
            grad.addColorStop(1.0, setAlpha(baseColor, 0.5));   // 尾部稍淡

            canvasCtx.fillStyle = grad;
            canvasCtx.fill();

            canvasCtx.restore();
          }

          drawStylizedBrow(FACE_LANDMARKS.leftBrow,  currentMakeup.brows);
          drawStylizedBrow(FACE_LANDMARKS.rightBrow, currentMakeup.brows);
        }

        // --- 特效层（不再用 soft-light 混合，走正常 alpha） ---
        canvasCtx.globalCompositeOperation = "source-over";

        // 公共的一些点
        const betweenEyes = landmarks[168];  // 两眉之间
        const leftCheekPt  = landmarks[234];
        const rightCheekPt = landmarks[454];

        // 1) Cat ears
        if (activeEffects.catEars) {
          const headX = betweenEyes.x * w;
          const headY = betweenEyes.y * h - 0.18 * h;

          const earOffsetX = 0.16 * w;
          const earHeight  = 0.12 * h;
          const earWidth   = 0.11 * w;

          function drawEar(cx, cy, dir) {
            const baseX = cx + dir * earOffsetX;
            const baseY = cy + earHeight * 0.6;

            canvasCtx.beginPath();
            canvasCtx.moveTo(baseX - earWidth / 2, baseY);
            canvasCtx.lineTo(baseX + earWidth / 2, baseY);
            canvasCtx.lineTo(baseX, baseY - earHeight);
            canvasCtx.closePath();

            canvasCtx.fillStyle = 'rgba(255, 180, 190, 0.95)';
            canvasCtx.fill();

            canvasCtx.strokeStyle = 'rgba(15, 23, 42, 0.7)';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
          }

          drawEar(headX, headY, -1);
          drawEar(headX, headY,  1);
        }

        // 2) Sparkle cheeks
        if (activeEffects.cheekSparkles) {
          function drawStar(cx, cy, size, color) {
            const spikes = 5;
            const outerRadius = size;
            const innerRadius = size * 0.45;

            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;

            canvasCtx.beginPath();
            canvasCtx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
              x = cx + Math.cos(rot) * outerRadius;
              y = cy + Math.sin(rot) * outerRadius;
              canvasCtx.lineTo(x, y);
              rot += Math.PI / spikes;

              x = cx + Math.cos(rot) * innerRadius;
              y = cy + Math.sin(rot) * innerRadius;
              canvasCtx.lineTo(x, y);
              rot += Math.PI / spikes;
            }
            canvasCtx.closePath();
            canvasCtx.fillStyle = color;
            canvasCtx.fill();
          }

          const baseColor = 'rgba(255, 248, 210, 0.9)';

          const lcx = leftCheekPt.x * w;
          const lcy = leftCheekPt.y * h;
          const rcx = rightCheekPt.x * w;
          const rcy = rightCheekPt.y * h;

          drawStar(lcx - 0.02 * w, lcy - 0.015 * h, 9, baseColor);
          drawStar(lcx + 0.03 * w, lcy + 0.01  * h, 7, baseColor);

          drawStar(rcx + 0.02 * w, rcy - 0.015 * h, 9, baseColor);
          drawStar(rcx - 0.03 * w, rcy + 0.01  * h, 7, baseColor);
        }

        // 3) Heart under eyes
        if (activeEffects.heartUnderEyes) {
          function drawHeart(cx, cy, size, color) {
            canvasCtx.save();
            canvasCtx.translate(cx, cy);
            canvasCtx.scale(size, size);
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, -0.3);
            canvasCtx.bezierCurveTo(-0.6, -0.9, -1.2, -0.1, 0, 0.8);
            canvasCtx.bezierCurveTo(1.2, -0.1, 0.6, -0.9, 0, -0.3);
            canvasCtx.closePath();
            canvasCtx.fillStyle = color;
            canvasCtx.fill();
            canvasCtx.restore();
          }

          const leftEyeUnderX  = landmarks[145].x * w;
          const leftEyeUnderY  = landmarks[145].y * h + 0.035 * h;
          const rightEyeUnderX = landmarks[374].x * w;
          const rightEyeUnderY = landmarks[374].y * h + 0.035 * h;

          const heartColor = 'rgba(255, 140, 180, 0.9)';
          drawHeart(leftEyeUnderX,  leftEyeUnderY,  12, heartColor);
          drawHeart(rightEyeUnderX, rightEyeUnderY, 12, heartColor);
        }

        // 4) Soft vignette
        if (activeEffects.softVignette) {
          const centerX = w / 2;
          const centerY = h / 2;
          const maxR    = Math.max(w, h) * 0.7;

          const vignetteGrad = canvasCtx.createRadialGradient(
            centerX, centerY, maxR * 0.35,
            centerX, centerY, maxR
          );
          vignetteGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.0)');
          vignetteGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.45)');

          canvasCtx.fillStyle = vignetteGrad;
          canvasCtx.fillRect(0, 0, w, h);
        }

        // 5) Floating shapes
        if (activeEffects.floatingShapes) {
          const headX = betweenEyes.x * w;
          const headY = betweenEyes.y * h - 0.22 * h;

          function drawFloatingTriangle(cx, cy, size, color) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(cx, cy - size);
            canvasCtx.lineTo(cx - size * 0.9, cy + size * 0.7);
            canvasCtx.lineTo(cx + size * 0.9, cy + size * 0.7);
            canvasCtx.closePath();
            canvasCtx.fillStyle = color;
            canvasCtx.fill();
          }

          drawFloatingTriangle(headX - 0.18 * w, headY,       18, 'rgba(244, 114, 182, 0.8)');
          drawFloatingTriangle(headX + 0.18 * w, headY + 6,   16, 'rgba(129, 140, 248, 0.8)');
          drawFloatingTriangle(headX,             headY - 12, 14, 'rgba(45, 212, 191, 0.8)');
        }
      }

      canvasCtx.restore();
    }

    // 初始化 Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
      }
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // 初始化摄像头
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 1280, height: 720 },
          audio: false
        });
        videoElement.srcObject = stream;

        videoElement.onloadedmetadata = () => {
          const camera = new Camera(videoElement, {
            onFrame: async () => {
              await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
          });
          camera.start();
        };
      } catch (err) {
        console.error('Camera error:', err);
        cameraError.style.display = 'flex';
      }
    }

    // UI 逻辑
    const toolsArea = document.getElementById('toolsArea');
    const segmentTabs = document.querySelectorAll('.segment-tab');

    function renderPalette(segment) {
      toolsArea.innerHTML = '';

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.textContent =
        segment === 'lips' ? 'Lip Colors' :
        segment === 'blush' ? 'Blush Shades' :
        segment === 'eyes' ? 'Eyeshadow' :
        segment === 'brows' ? 'Brow Colors' :
        'Effects';

      // Effects 特殊处理：显示可以多选的效果按钮
      if (segment === 'effects') {
        const grid = document.createElement('div');
        grid.className = 'palette';

        const effectsList = [
          { key: 'catEars',        label: 'Cat Ears' },
          { key: 'cheekSparkles',  label: 'Sparkle Cheeks' },
          { key: 'heartUnderEyes', label: 'Heart Under Eyes' },
          { key: 'softVignette',   label: 'Soft Vignette' },
          { key: 'floatingShapes', label: 'Floating Shapes' }
        ];

        effectsList.forEach(item => {
          const chip = document.createElement('button');
          chip.className = 'tool-chip';
          if (activeEffects[item.key]) chip.classList.add('active');

          const dot = document.createElement('div');
          dot.className = 'color-dot';
          dot.style.background = 'rgba(248, 250, 252, 0.12)';

          const label = document.createElement('div');
          label.className = 'tool-label';
          label.textContent = item.label;

          chip.appendChild(dot);
          chip.appendChild(label);

          chip.addEventListener('click', () => {
            activeEffects[item.key] = !activeEffects[item.key];
            renderPalette(segment);
          });

          grid.appendChild(chip);
        });

        toolsArea.appendChild(sectionTitle);
        toolsArea.appendChild(grid);
        return; // 这里直接返回，不走下面 palettes 的逻辑
      }

      const paletteGrid = document.createElement('div');
      paletteGrid.className = 'palette';

      palettes[segment].forEach((item, index) => {
        const chip = document.createElement('button');
        chip.className = 'tool-chip';
        if (activeSelections[segment] === index) {
          chip.classList.add('active');
        }

        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = item.color;

        const label = document.createElement('div');
        label.className = 'tool-label';
        label.textContent = item.label;

        chip.appendChild(dot);
        chip.appendChild(label);

        chip.addEventListener('click', () => {
          activeSelections[segment] = index;
          if (segment === 'effects') {
            currentMakeup[segment] = item;  // 保存整个 item 对象（包含 type）
          } else {
            currentMakeup[segment] = item.color;
          }
          renderPalette(segment);
        });

        paletteGrid.appendChild(chip);
      });

      toolsArea.appendChild(sectionTitle);
      toolsArea.appendChild(paletteGrid);
    }

    function setActiveSegment(segment) {
      activeSegment = segment;
      segmentTabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.segment === segment);
      });
      renderPalette(segment);
    }

    segmentTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const segment = tab.dataset.segment;
        if (segment && segment !== activeSegment) {
          setActiveSegment(segment);
        }
      });
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      currentMakeup = { lips: null, blush: null, eyes: null, brows: null, effects: null };
      activeSelections = { lips: null, blush: null, eyes: null, brows: null, effects: null };
      activeEffects = {
        catEars: false,
        cheekSparkles: false,
        heartUnderEyes: false,
        softVignette: false,
        floatingShapes: false
      };
      renderPalette(activeSegment);
    });

    // 启动
    setActiveSegment('lips');
    initCamera();
  </script>
</body>
</html>
