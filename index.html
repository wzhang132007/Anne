<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Makeup Mini Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: #f9fafb;
    }

    .app {
      width: min(1100px, 100vw - 24px);
      height: min(650px, 100vh - 24px);
      background: #020617;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
    }

    .camera-panel {
      position: relative;
      flex: 3;
      background: #000;
      overflow: hidden;
    }

    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvasElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .hint {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .camera-error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      background: radial-gradient(circle at top, #111827, #020617);
      z-index: 100;
    }

    .tools-panel {
      flex: 2;
      background: linear-gradient(145deg, #020617, #020617, #111827);
      padding: 18px 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-left: 1px solid rgba(30, 64, 175, 0.4);
    }

    .tools-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .app-subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    .segment-tabs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .segment-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #e5e7eb;
      background: radial-gradient(circle at top, #020617, #020617);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .segment-tab.active {
      background: radial-gradient(circle at top, #4c1d95, #1d4ed8);
      border-color: rgba(191, 219, 254, 0.9);
      color: #f9fafb;
      box-shadow: 0 0 16px rgba(129, 140, 248, 0.6);
    }

    .segment-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(248, 250, 252, 0.8);
    }

    .tools-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 4px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tool-chip {
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: radial-gradient(circle at top, #020617, #020617);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 11px;
      color: #e5e7eb;
      text-align: center;
    }

    .tool-chip:hover {
      border-color: rgba(191, 219, 254, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.6);
    }

    .tool-chip.active {
      border-color: #f9a8d4;
      box-shadow: 0 0 14px rgba(244, 114, 182, 0.9);
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .tool-label {
      line-height: 1.2;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 12px;
    }

    .small-note {
      font-size: 11px;
      color: #6b7280;
    }

    .ghost-btn {
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), #020617);
      color: #e5e7eb;
    }

    .ghost-btn:hover {
      border-color: rgba(248, 250, 252, 0.8);
    }

    .btn-icon {
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(55, 65, 81, 0.8);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="camera-panel">
      <video id="videoElement" autoplay playsinline muted></video>
      <canvas id="canvasElement"></canvas>

      <div class="hint">
        <span class="hint-dot"></span>
        <span>Face tracking active ✨</span>
      </div>

      <div id="cameraError" class="camera-error" style="display: none;">
        无法访问摄像头 🥲<br>
        请检查浏览器的摄像头权限
      </div>
    </div>

    <div class="tools-panel">
      <header class="tools-header">
        <div class="app-title">AR Makeup Game</div>
        <div class="app-subtitle">Face tracking makeup effects</div>

        <div class="segment-tabs">
          <button class="segment-tab active" data-segment="lips">
            <span class="segment-dot"></span>
            Lips
          </button>
          <button class="segment-tab" data-segment="blush">Cheeks</button>
          <button class="segment-tab" data-segment="eyes">Eyes</button>
        </div>
      </header>

      <main class="tools-scroll" id="toolsArea"></main>

      <footer class="footer-actions">
        <div class="small-note">
          Real-time face tracking
        </div>
        <div>
          <button class="ghost-btn" id="clearAllBtn">
            <span class="btn-icon">🧴</span>
            清除妆容
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');
    const cameraError = document.getElementById('cameraError');

    // MediaPipe Face Mesh 关键点索引
    const FACE_LANDMARKS = {
      // 嘴唇轮廓 - 更精确
      lips: {
        upper: [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291],
        lower: [146, 91, 181, 84, 17, 314, 405, 321, 375, 61],
        outer: [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185]
      },
      // 眼影区域
      leftEye: [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246],
      rightEye: [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398],
      // 腮红区域 (脸颊)
      leftCheek: [116, 123, 147, 213, 192, 214, 212, 202, 194],
      rightCheek: [345, 352, 376, 433, 416, 434, 432, 422, 418]
    };

    // 颜色配置
    const palettes = {
      lips: [
        { label: "Cherry", color: "rgba(227, 35, 86, 0.75)" },
        { label: "Rose", color: "rgba(214, 92, 124, 0.75)" },
        { label: "Coral", color: "rgba(244, 114, 82, 0.75)" },
        { label: "Plum", color: "rgba(147, 51, 234, 0.75)" },
        { label: "Brick", color: "rgba(185, 28, 28, 0.8)" },
        { label: "Soft Nude", color: "rgba(248, 187, 151, 0.85)" }
      ],
      blush: [
        { label: "Soft Pink", color: "rgba(248, 113, 166, 0.5)" },
        { label: "Warm Coral", color: "rgba(248, 153, 112, 0.5)" },
        { label: "Peach", color: "rgba(252, 211, 172, 0.6)" },
        { label: "Rose Flush", color: "rgba(225, 29, 72, 0.35)" }
      ],
      eyes: [
        { label: "Brown Nude", color: "rgba(88, 64, 44, 0.6)" },
        { label: "Cool Smoke", color: "rgba(55, 65, 81, 0.65)" },
        { label: "Soft Lilac", color: "rgba(167, 139, 250, 0.6)" },
        { label: "Gold Shimmer", color: "rgba(250, 204, 21, 0.45)" }
      ]
    };

    let activeSegment = "lips";
    let activeSelections = { lips: null, blush: null, eyes: null };
    let currentMakeup = { lips: null, blush: null, eyes: null };

    // 绘制多边形
    function drawPolygon(ctx, points, color) {
      if (!points || points.length === 0) return;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
      ctx.fill();
    }

    // 获取关键点坐标
    function getLandmarkPoints(landmarks, indices, width, height) {
      return indices.map(index => ({
        x: landmarks[index].x * width,
        y: landmarks[index].y * height
      }));
    }

    // MediaPipe Face Mesh 回调
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const width = canvasElement.width;
        const height = canvasElement.height;

        // 绘制嘴唇
        if (currentMakeup.lips) {
          const upperLip = getLandmarkPoints(landmarks, FACE_LANDMARKS.lips.upper, width, height);
          const lowerLip = getLandmarkPoints(landmarks, FACE_LANDMARKS.lips.lower, width, height);
          const outerLip = getLandmarkPoints(landmarks, FACE_LANDMARKS.lips.outer, width, height);

          drawPolygon(canvasCtx, outerLip, currentMakeup.lips);
        }

        // 绘制腮红
        if (currentMakeup.blush) {
          const leftCheek = getLandmarkPoints(landmarks, FACE_LANDMARKS.leftCheek, width, height);
          const rightCheek = getLandmarkPoints(landmarks, FACE_LANDMARKS.rightCheek, width, height);

          drawPolygon(canvasCtx, leftCheek, currentMakeup.blush);
          drawPolygon(canvasCtx, rightCheek, currentMakeup.blush);
        }

        // 绘制眼影
        if (currentMakeup.eyes) {
          const leftEye = getLandmarkPoints(landmarks, FACE_LANDMARKS.leftEye, width, height);
          const rightEye = getLandmarkPoints(landmarks, FACE_LANDMARKS.rightEye, width, height);

          drawPolygon(canvasCtx, leftEye, currentMakeup.eyes);
          drawPolygon(canvasCtx, rightEye, currentMakeup.eyes);
        }
      }

      canvasCtx.restore();
    }

    // 初始化 Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
      }
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // 初始化摄像头
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 1280, height: 720 },
          audio: false
        });
        videoElement.srcObject = stream;

        videoElement.onloadedmetadata = () => {
          const camera = new Camera(videoElement, {
            onFrame: async () => {
              await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
          });
          camera.start();
        };
      } catch (err) {
        console.error('Camera error:', err);
        cameraError.style.display = 'flex';
      }
    }

    // UI 逻辑
    const toolsArea = document.getElementById('toolsArea');
    const segmentTabs = document.querySelectorAll('.segment-tab');

    function renderPalette(segment) {
      toolsArea.innerHTML = '';

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.textContent =
        segment === 'lips' ? 'Lip Colors' :
        segment === 'blush' ? 'Blush Shades' : 'Eyeshadow';

      const paletteGrid = document.createElement('div');
      paletteGrid.className = 'palette';

      palettes[segment].forEach((item, index) => {
        const chip = document.createElement('button');
        chip.className = 'tool-chip';
        if (activeSelections[segment] === index) {
          chip.classList.add('active');
        }

        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = item.color;

        const label = document.createElement('div');
        label.className = 'tool-label';
        label.textContent = item.label;

        chip.appendChild(dot);
        chip.appendChild(label);

        chip.addEventListener('click', () => {
          activeSelections[segment] = index;
          currentMakeup[segment] = item.color;
          renderPalette(segment);
        });

        paletteGrid.appendChild(chip);
      });

      toolsArea.appendChild(sectionTitle);
      toolsArea.appendChild(paletteGrid);
    }

    function setActiveSegment(segment) {
      activeSegment = segment;
      segmentTabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.segment === segment);
      });
      renderPalette(segment);
    }

    segmentTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const segment = tab.dataset.segment;
        if (segment && segment !== activeSegment) {
          setActiveSegment(segment);
        }
      });
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      currentMakeup = { lips: null, blush: null, eyes: null };
      activeSelections = { lips: null, blush: null, eyes: null };
      renderPalette(activeSegment);
    });

    // 启动
    setActiveSegment('lips');
    initCamera();
  </script>
</body>
</html>
